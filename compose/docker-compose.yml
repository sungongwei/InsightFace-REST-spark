services:
  ifr-trt-gpu0:
    image: insightface-rest:${IFR_VERSION}
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile_trt
    hostname: ifr
    env_file:
      - .env
    volumes:
      - ../models:/models
      - ../if_rest:/app/if_rest
      - ../entrypoint.sh:/app/entrypoint.sh
      - ../misc/test_images:/images/test_images
      # Volume for persistent face data storage
      - ./face_data:/app/data
    ports:
      - 18081:18080
    environment:
      # Set the database path to use the persistent volume
      - DB_PATH=/app/data/faces.db
      # Enable GPU if needed
      - USE_GPU=true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ['0']
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:18080/health" ]
      interval: 300s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  face_data:
