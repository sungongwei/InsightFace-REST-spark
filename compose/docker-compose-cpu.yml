services:
  ifr-cpu:
    image: insightface-rest-cpu:${IFR_VERSION}
    build:
      context: ../
      dockerfile: dockerfiles/Dockerfile_cpu
    hostname: ifr
    env_file:
      - cpu.env
    volumes:
      - ../models:/models
      - ../if_rest:/app/if_rest
      - ../entrypoint.sh:/app/entrypoint.sh
      # Volume for persistent face data storage
      - face_data:/app/data
    ports:
      - 18081:18080
    environment:
      # Set the database path to use the persistent volume
      - DB_PATH=/app/data/faces.db
      # Disable GPU for CPU version
      - USE_GPU=false

volumes:
  face_data:

